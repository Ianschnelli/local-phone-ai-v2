[project]
name = "local-phone-ai-v2"
version = "0.1.0"
description = "Local on-premise phone AI"
readme = "README.md"
authors = [
    { name = "Ianschnelli", email = "adrian.iannelli@t-online.de" }
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "faster-whisper==1.2.1",
    "pipecat-ai[kokoro,local]==1.7.0",
    "piper-tts==1.7.0",
    "PyYAML==6.0.3",
    "docling==2.125.0",
    "qdrant-client[fastembed]==1.19.0",
    "fastembed==0.8.0",
    "transformers==5.16.1",
    "sentence-transformers==6.0.1",
    "huggingface-hub==1.29.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
]

# PyTorch-Variante je Rechner (Reranker/Embeddings). Genau eine wählen:
#   uv sync --extra gpu   NVIDIA ab RTX 20xx (Turing) bis RTX 50xx, Treiber ab 580 (CUDA 13.0)
#   uv sync --extra cpu   Rechner ohne NVIDIA-Karte
# Der Code wählt das Gerät selbst (device: auto, config/devices.py).
[project.optional-dependencies]
cpu = [
    "torch==2.14.0",
    "torchvision==0.29.0",
]
gpu = [
    "torch==2.14.0",
    "torchvision==0.29.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
local-phone-ai-v2 = "local_phone_ai_v2.__main__:main"

[build-system]
requires = [
    "uv_build>=0.12.7,<0.13.0"
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
